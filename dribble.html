<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dribbble – Search: landing page</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="screen.css">
</head>
<body>

<div class="container-lg px-4">

  <!-- Filter bar -->
  <div class="filter-bar d-flex align-items-center gap-3">

    <button class="btn-popular">
      Popular <i class="bi bi-chevron-down"></i>
    </button>

    <div class="filter-tabs">
      <button class="filter-tab active">Discover</button>
      <button class="filter-tab">Animation</button>
      <button class="filter-tab">Branding</button>
      <button class="filter-tab">Illustration</button>
      <button class="filter-tab">Mobile</button>
      <button class="filter-tab">Print</button>
      <button class="filter-tab"><i class="bi bi-chevron-right"></i></button>
    </div>

    <button class="btn-filters ms-auto">
      <i class="bi bi-sliders"></i> Filters
    </button>

  </div>

  <!-- Shot grid -->
  <div class="row g-4">

    <!-- Card 1 – Siege Media (beige, business icons) -->
    <div class="col-12 col-md-4">
      <div class="shot-card">
        <div class="shot-thumb canvas-beige">
          <div class="shot-placeholder canvas-beige">
            <div class="icon-grid">
              <i class="bi bi-bar-chart-line"></i>
              <i class="bi bi-bank"></i>
              <i class="bi bi-dice-3"></i>
              <i class="bi bi-bag-dollar"></i>
              <i class="bi bi-tools"></i>
              <i class="bi bi-globe2"></i>
              <i class="bi bi-handshake"></i>
              <i class="bi bi-calendar3"></i>
              <i class="bi bi-megaphone"></i>
            </div>
          </div>
          <div class="shot-overlay"></div>
        </div>
        <div class="author-row">
          <div class="author-avatar-text avatar-siege">sm</div>
          <span class="author-name">Siege Media</span>
          <span class="badge-team">TEAM</span>
          <div class="stat-row">
            <span class="stat-item"><i class="bi bi-heart"></i> 193</span>
            <span class="stat-item"><i class="bi bi-eye"></i> 67.4k</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 2 – Orman Clark (dark, dense icon set) -->
    <div class="col-12 col-md-4">
      <div class="shot-card">
        <div class="shot-thumb canvas-black">
          <div class="shot-placeholder canvas-black icon-grid icon-grid-dark icon-grid-8col">
            <i class="bi bi-type-h1"></i><i class="bi bi-type-h2"></i><i class="bi bi-type-h3"></i><i class="bi bi-type-bold"></i>
            <i class="bi bi-type-italic"></i><i class="bi bi-link45deg"></i><i class="bi bi-image"></i><i class="bi bi-table"></i>
            <i class="bi bi-list-ul"></i><i class="bi bi-list-ol"></i><i class="bi bi-code-slash"></i><i class="bi bi-blockquote-left"></i>
            <i class="bi bi-grip-horizontal"></i><i class="bi bi-layout-split"></i><i class="bi bi-columns-gap"></i><i class="bi bi-grid-3x3"></i>
            <i class="bi bi-mic"></i><i class="bi bi-camera-video"></i><i class="bi bi-film"></i><i class="bi bi-music-note"></i>
            <i class="bi bi-file-text"></i><i class="bi bi-file-earmark-pdf"></i><i class="bi bi-folder2"></i><i class="bi bi-archive"></i>
            <i class="bi bi-search"></i><i class="bi bi-sliders"></i><i class="bi bi-funnel"></i><i class="bi bi-sort-down"></i>
            <i class="bi bi-bell"></i><i class="bi bi-gear"></i><i class="bi bi-lock"></i><i class="bi bi-shield-check"></i>
          </div>
          <div class="shot-overlay"></div>
        </div>
        <div class="author-row">
          <div class="author-avatar-text avatar-orman">OC</div>
          <span class="author-name">Orman Clark</span>
          <span class="badge-pro">PRO</span>
          <div class="stat-row">
            <span class="stat-item"><i class="bi bi-heart"></i> 98</span>
            <span class="stat-item"><i class="bi bi-eye"></i> 24.2k</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 3 – Jordon Cheung (light, outline icons) -->
    <div class="col-12 col-md-4">
      <div class="shot-card">
        <div class="shot-thumb canvas-white">
          <div class="shot-placeholder canvas-white icon-grid icon-grid-outline icon-grid-5col">
            <i class="bi bi-diagram-3"></i><i class="bi bi-grid-1x2"></i><i class="bi bi-bezier2"></i><i class="bi bi-calendar4"></i><i class="bi bi-gear-wide"></i>
            <i class="bi bi-cloud-download"></i><i class="bi bi-file-earmark-bar-graph"></i><i class="bi bi-eyedropper"></i><i class="bi bi-lock-fill"></i><i class="bi bi-pin-map"></i>
            <i class="bi bi-floppy"></i><i class="bi bi-sliders2"></i><i class="bi bi-shield-half"></i><i class="bi bi-chat-dots"></i><i class="bi bi-card-image"></i>
            <i class="bi bi-diagram-2"></i><i class="bi bi-briefcase"></i><i class="bi bi-graph-up"></i><i class="bi bi-arrow-left-right"></i><i class="bi bi-bar-chart-steps"></i>
          </div>
          <div class="shot-overlay"></div>
        </div>
        <div class="author-row">
          <div class="author-avatar-text avatar-jordon">JC</div>
          <span class="author-name">Jordon Cheung</span>
          <div class="stat-row">
            <span class="stat-item"><i class="bi bi-heart"></i> 176</span>
            <span class="stat-item"><i class="bi bi-eye"></i> 57.1k</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 4 – Aldo Crusher (beige, purple filled icons) -->
    <div class="col-12 col-md-4">
      <div class="shot-card">
        <div class="shot-thumb canvas-beige">
          <div class="shot-placeholder canvas-beige icon-grid icon-grid-purple icon-grid-3col-wide">
            <i class="bi bi-camera-fill"></i>
            <i class="bi bi-person-fill"></i>
            <i class="bi bi-box-fill"></i>
            <i class="bi bi-key-fill"></i>
            <i class="bi bi-stars"></i>
            <i class="bi bi-heart-fill"></i>
            <i class="bi bi-moon-stars-fill"></i>
            <i class="bi bi-gem"></i>
            <i class="bi bi-eye-fill"></i>
          </div>
          <div class="shot-overlay"></div>
        </div>
        <div class="author-row">
          <div class="author-avatar-text avatar-aldo">AC</div>
          <span class="author-name">Aldo Crusher</span>
          <span class="badge-pro">PRO</span>
          <div class="stat-row">
            <span class="stat-item"><i class="bi bi-heart"></i> 65</span>
            <span class="stat-item"><i class="bi bi-eye"></i> 6.7k</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 5 – Canto (ad, orange) -->
    <div class="col-12 col-md-4">
      <div class="shot-card ad-card">
        <div class="shot-thumb">
          <div class="shot-placeholder canvas-orange"></div>
          <div class="overlay-actions overlay-actions--visible">
            <button class="overlay-btn"><i class="bi bi-box-arrow-up-right"></i></button>
          </div>
        </div>
        <div class="author-row">
          <div class="author-avatar-text avatar-canto">
            <i class="bi bi-c-circle-fill avatar-canto__icon"></i>
          </div>
          <span class="author-name">Canto</span>
          <div class="stat-row">
            <span class="ad-actions">
              <a href="#">Hide ads</a> &bull; <a href="#">Advertise</a>
            </span>
          </div>
        </div>
      </div>
    </div>

    <!-- Card 6 – Ramy Wafaa (tan, green illustrations) -->
    <div class="col-12 col-md-4">
      <div class="shot-card">
        <div class="shot-thumb canvas-tan">
          <div class="shot-placeholder canvas-tan">
            <div class="illus-grid">
              <div class="illus-figure illus-figure--green">🧑‍🎨</div>
              <div class="illus-figure illus-figure--green">🤸</div>
              <div class="illus-figure illus-figure--green">👩‍💻</div>
              <div class="illus-figure illus-figure--green">🐱</div>
              <div class="illus-figure illus-figure--green">🌿</div>
              <div class="illus-figure illus-figure--green">🦋</div>
            </div>
          </div>
          <div class="shot-overlay">
            <span class="shot-overlay-title">ilcons / mini illustr...</span>
          </div>
          <div class="overlay-actions">
            <button class="overlay-btn"><i class="bi bi-bookmark"></i></button>
            <button class="overlay-btn"><i class="bi bi-heart"></i></button>
          </div>
        </div>
        <div class="author-row">
          <div class="author-avatar-text avatar-ramy">RW</div>
          <span class="author-name">Ramy Wafaa</span>
          <span class="badge-pro">PRO</span>
          <div class="stat-row">
            <span class="stat-item"><i class="bi bi-heart"></i> 513</span>
            <span class="stat-item"><i class="bi bi-eye"></i> 143k</span>
          </div>
        </div>
      </div>
    </div>

  </div><!-- /row -->
</div><!-- /container -->

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
